name: hydrate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.0+2

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_svg: ^2.1.0
  shared_preferences: ^2.2.2
  bottom_picker: ^3.0.0
  lottie: ^3.3.1
  audioplayers: ^6.4.0
  firebase_core: ^3.13.0
  
  

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  salomon_bottom_bar: ^3.3.2

  smooth_page_indicator: ^1.2.1
  water_bottle: ^0.0.7
  dashed_circular_progress_bar: ^0.0.6
  curved_navigation_bar: ^1.0.6
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  awesome_notifications: ^0.10.1
  palette_generator: ^0.3.3+6
  http: ^1.3.0
  firebase_messaging: ^15.2.5
  confetti: ^0.8.0
  fl_chart: ^1.0.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.5.3
  fluttertoast: ^8.2.12
  provider: ^6.1.5
  get_it: ^8.0.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png

flutter_native_splash:
  color: "#d4e4ed"
  image: assets/images/logo.png
  android: true
  ios: true

  android_12:
    image: assets/images/logo.png
    color: "#fafafa"
    icon_background_color: "#fafafa"
    color_dark: "#fafafa"
    icon_background_color_dark: "#042a49"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/berhasil.svg
    - assets/images/glass/
    - assets/images/logo.png
    - assets/images/navigasi/
    - assets/images/profile/
    - assets/sounds/
    - assets/images/splash/

  
  fonts:
    - family: Gluten
      fonts:
        - asset: assets/fonts/Gluten-Black.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
